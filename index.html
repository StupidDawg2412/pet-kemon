      var btn = document.getElementById("lang-toggle");

      function apply(lang) {
        var dict = I18N[lang];
        document.documentElement.lang = lang;
        var nodes = document.querySelectorAll("[data-i18n]");
        for (var i = 0; i < nodes.length; i++) {
          var key = nodes[i].getAttribute("data-i18n");
          if (dict[key] != null) nodes[i].textContent = dict[key];
        }
        btn.textContent = dict.toggleLabel;
        btn.setAttribute("aria-label", dict.toggleAria);
        btn.dataset.lang = lang;
      }

      var initial = (navigator.language || "en").toLowerCase().indexOf("th") === 0 ? "th" : "en";
      apply(initial);

      btn.addEventListener("click", function () {
        apply(btn.dataset.lang === "th" ? "en" : "th");
      });
    })();
