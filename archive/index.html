<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pet-kemon · catch 'em all</title>
  <meta name="description" content="pet-kemon — news, memes & fluff. Catch 'em all." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language">EN</button>

  <main class="card-stack">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="40" height="40" fill="#1a1a1a">
        <ellipse cx="24" cy="30" rx="11" ry="8.5"/>
        <circle cx="13" cy="20" r="4.2"/>
        <circle cx="22" cy="15" r="4.2"/>
        <circle cx="32" cy="16" r="4.2"/>
        <circle cx="39" cy="23" r="3.6"/>
      </svg>
    </div>

    <h1 class="handle">
      pet-kemon
      <svg class="verified" viewBox="0 0 24 24" width="22" height="22" role="img" aria-label="Verified">
        <path fill="#1d9bf0" d="M12 1l2.6 2.1 3.3-.4 1.2 3.1 3 1.5-1 3.2 1 3.2-3 1.5-1.2 3.1-3.3-.4L12 23l-2.6-2.1-3.3.4-1.2-3.1-3-1.5 1-3.2-1-3.2 3-1.5L6.1 2.7l3.3.4z"/>
        <path fill="#fff" d="M10.6 15.3l-2.9-2.9 1.3-1.3 1.6 1.6 4-4 1.3 1.3z"/>
      </svg>
    </h1>

    <p class="bio" data-i18n="bio">🐾 catch 'em all — news, memes &amp; fluff</p>

    <a href="#" data-link="shopee" class="card card--full card--shopee">
      <span class="card__icon">
        <img class="brand brand--shopee" src="assets/svg/shopee.svg" alt="" aria-hidden="true" />
      </span>
      <span class="card__body">
        <span class="card__title" data-i18n="shopee-title">Shop my Shopee</span>
        <span class="card__sub" data-i18n="shopee-sub">my fave pet gear &amp; treats →</span>
      </span>
      <span class="card__badge" data-i18n="sale">SALE</span>
    </a>

    <a href="#" data-link="youtube" class="card card--full card--youtube">
      <span class="card__icon">
        <img class="brand brand--youtube" src="assets/svg/youtube.svg" alt="" aria-hidden="true" />
      </span>
      <span class="card__body">
        <span class="card__title">YouTube</span>
        <span class="card__sub" data-i18n="youtube-sub">1.2M subscribers</span>
      </span>
      <span class="card__arrow" aria-hidden="true">↗</span>
    </a>

    <div class="grid2">
      <a href="#" data-link="tiktok" class="card card--half card--dark">
        <span class="card__icon card__icon--ghost">
          <img class="brand brand--tiktok" src="assets/svg/tiktok.svg" alt="" aria-hidden="true" />
        </span>
        <span class="card__title card__title--sm">TikTok</span>
        <span class="card__sub" data-i18n="tiktok-sub">3.4M followers</span>
      </a>

      <a href="#" data-link="instagram" class="card card--half card--instagram">
        <span class="card__icon card__icon--ghost">
          <img class="brand brand--instagram" src="assets/svg/instagram.svg" alt="" aria-hidden="true" />
        </span>
        <span class="card__title card__title--sm">Instagram</span>
        <span class="card__sub" data-i18n="instagram-sub">870K followers</span>
      </a>
    </div>

    <div class="grid2">
      <a href="#" data-link="facebook" class="card card--half card--facebook">
        <span class="card__icon card__icon--ghost">
          <img class="brand brand--facebook" src="assets/svg/facebook.svg" alt="" aria-hidden="true" />
        </span>
        <span class="card__title card__title--sm">Facebook</span>
        <span class="card__sub" data-i18n="facebook-sub">248K likes</span>
      </a>

      <a href="#" data-link="x" class="card card--half card--dark">
        <span class="card__icon card__icon--ghost">
          <img class="brand brand--x" src="assets/svg/x.svg" alt="" aria-hidden="true" />
        </span>
        <span class="card__title card__title--sm">X</span>
        <span class="card__sub" data-i18n="x-sub">96K followers</span>
      </a>
    </div>

    <footer class="foot" data-i18n="footer">🐾 made with treats · pet-kemon 2026</footer>
  </main>

  <script>
    (function () {
      const [yt_sub, tt_sub, ig_sub, fb_sub, x_sub] = [11, 7, 0, 87, 0];
      var I18N = {
        en: {
          bio: "🐾 catch 'em all — news, memes & fluff",
          "shopee-title": "Shopee Stall Shop",
          "shopee-sub": "Pamper your overlord & fund their loyal servant →",
          sale: "SALE",
          "youtube-sub": `${yt_sub} subscribers`,
          "tiktok-sub": `${tt_sub} followers`,
          "instagram-sub": `${ig_sub} followers`,
          "facebook-sub": `${fb_sub} likes`,
          "x-sub": `${x_sub} followers`,
          footer: "🐾 made with treats · pet-kemon 2026",
          toggleLabel: "TH",
          toggleAria: "เปลี่ยนเป็นภาษาไทย"
        },
        th: {
          bio: "🐾 catch 'em all — ข่าว มีม และความน่ารัก",
          "shopee-title": "แผงลอย Shopee",
          "shopee-sub": "บำเรอเจ้านายและสนับสนุนทาสได้ที่นี่ →",
          sale: "ลดราคา",
          "youtube-sub": `ผู้ติดตาม ${yt_sub}`,
          "tiktok-sub": `ผู้ติดตาม ${tt_sub}`,
          "instagram-sub": `ผู้ติดตาม ${ig_sub}`,
          "facebook-sub": `ถูกใจ ${fb_sub}`,
          "x-sub": `ผู้ติดตาม ${x_sub}`,
          footer: "🐾 made with treats · pet-kemon 2026",
          toggleLabel: "EN",
          toggleAria: "Switch to English"
        }
      };

      var btn = document.getElementById("lang-toggle");

      function apply(lang) {
        var dict = I18N[lang];
        document.documentElement.lang = lang;
        var nodes = document.querySelectorAll("[data-i18n]");
        for (var i = 0; i < nodes.length; i++) {
          var key = nodes[i].getAttribute("data-i18n");
          if (dict[key] != null) nodes[i].textContent = dict[key];
        }
        btn.textContent = dict.toggleLabel;
        btn.setAttribute("aria-label", dict.toggleAria);
        btn.dataset.lang = lang;
      }

      var initial = (navigator.language || "en").toLowerCase().indexOf("th") === 0 ? "th" : "en";
      apply(initial);

      btn.addEventListener("click", function () {
        apply(btn.dataset.lang === "th" ? "en" : "th");
      });
    })();
  </script>
</body>
</html>
